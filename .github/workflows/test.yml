name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  fresh-clone:
    # Proves the repo is self-contained and PoCs run on a fresh checkout
    runs-on: ubuntu-latest
    steps:
      - name: Clone as a reviewer would
        run: |
          git clone https://github.com/${{ github.repository }}.git cloned
          cd cloned
          test -f .gitmodules && { echo "FAIL: .gitmodules exists"; exit 1; } || true
          test -f lib/forge-std/src/Test.sol
          test -f lib/openzeppelin-contracts/contracts/proxy/ERC1967/ERC1967Proxy.sol
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run PoCs on fresh checkout
        run: |
          cd cloned
          forge test --match-path 'test/poc/*.t.sol' -vv
