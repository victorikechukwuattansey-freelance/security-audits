name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

name: test
on: [push, pull_request]

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge test --match-path 'test/poc/*.t.sol' -vv

  fresh-clone:
    # The only test that proves the repo is self-contained.
    runs-on: ubuntu-latest
    steps:
      - name: Clone as a reviewer would
        run: |
          git clone https://github.com/${{ github.repository }}.git cloned
          cd cloned
          test -f .gitmodules && { echo "FAIL: .gitmodules exists"; exit 1; } || true
          test -f lib/forge-std/src/Test.sol
          test -f lib/openzeppelin-contracts/contracts/proxy/ERC1967/ERC1967Proxy.sol
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run PoCs on fresh checkout
        run: |
          cd cloned
          forge test --match-path 'test/poc/*.t.sol' -vv
